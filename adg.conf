# GL dashboard statistics remain authenticated by the existing Admin-Token.
# Never inject backend credentials into the general /control/ API location.
location ~ ^/control/(stats|stats_info)$ {
    set $mudi7_adguard_authorization "";
    access_by_lua_file /usr/libexec/mudi7-adguard-stats.lua;
    content_by_lua_file /usr/libexec/mudi7-adguard-top-five.lua;
}
location /control/ {
    proxy_pass http://127.0.0.1:3000;
}
